# dsh-dependency-graph bundle layer: inserts the host tool plugin into a
# profile's layer stack. Install with:
#   npx -y @deepseek-ai/dsh plugin --profile web add @qingshanjiluo/dsh-dependency-graph
- insert:
    - id: dependency-graph
      name: '@qingshanjiluo/dsh-dependency-graph'
      config:
        maxCycles: 50
        entryPoints: []
